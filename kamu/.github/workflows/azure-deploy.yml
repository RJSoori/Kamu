name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip source for deployment
        # node_modules/.next are excluded -- Azure's Oryx builder runs
        # `npm install && npm run build` remotely (SCM_DO_BUILD_DURING_DEPLOYMENT),
        # using the app's own App Settings as build-time env vars. See
        # docs/azure-deployment.md.
        run: zip -r release.zip . -x "node_modules/*" ".git/*" ".next/*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
