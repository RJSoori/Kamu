name: Customer app CI (kamu)

on:
  pull_request:
    paths:
      - "kamu/**"
      - ".github/workflows/customer-ci.yml"
  push:
    branches: [main]
    paths:
      - "kamu/**"
      - ".github/workflows/customer-ci.yml"

defaults:
  run:
    working-directory: kamu

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Shape-only validation (src/lib/env.ts / env.server.ts) -- no test
      # hits a live Supabase project, so placeholder values are enough.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kamu/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
